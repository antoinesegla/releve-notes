name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
      - name: Install Flet
        run: |
          pip install flet==0.27.6
          flutter doctor
      - name: Build APK
        run: |
          flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: releve-notes-apk
          path: build/apk
